name: Build

on:
  push:
    branches: [fix/x11-region-cancel-esc]
  workflow_dispatch:

jobs:
  build:
    name: cmake build (ubuntu 26.04 container)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-private-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-wayland-dev \
            libqt6svg6-dev \
            libkf6windowsystem-dev \
            liblayer-shell-qt-dev \
            lxqt2-build-tools-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-util-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j"$(nproc)"
